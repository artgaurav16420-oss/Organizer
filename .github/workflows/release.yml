name: release
on:
  push:
    tags:
      - "v[0-9]*"
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: rm -rf build dist
      - run: python -m build --wheel --no-isolation
      # The tag names the release, the build names the wheel: a v1.0.0 tag on a
      # commit that still declares 0.2.0 would publish a misleading asset.
      - name: Verify the wheel version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in
              *-"$tag"-*) ;;
              *) echo "ERROR: $(basename "$wheel") does not match tag v$tag"; exit 1 ;;
            esac
          done
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: dist/*.whl