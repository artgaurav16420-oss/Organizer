name: release
on:
  push:
    tags:
      - "v[0-9]*"
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # A tag can point at any commit, including one whose suite is red. The build
  # job needs this gate: a failed verify means no release asset is published.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q --cov=fermi_organizer --cov=fermi_report_xlsx --cov=cve_watch --cov-fail-under=87
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: rm -rf build dist
      - run: python -m build --wheel --no-isolation
      # The tag names the release, the build names the wheel: a v1.0.0 tag on a
      # commit that still declares 0.2.0 would publish a misleading asset.
      - name: Verify the wheel version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in
              *-"$tag"-*) ;;
              *) echo "ERROR: $(basename "$wheel") does not match tag v$tag"; exit 1 ;;
            esac
          done
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.whl