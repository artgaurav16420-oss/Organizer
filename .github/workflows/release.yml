name: release
on:
  push:
    tags:
      - "v[0-9]*"
permissions:
  contents: write
concurrency:
  # Distinct from pytest.yml's `${{ github.workflow }}-${{ github.ref }}`: a
  # called workflow sees the caller's name in github.workflow, so reusing that
  # form here makes both workflows share one group - and pytest.yml's
  # cancel-in-progress: true then cancels the release that called it.
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # A tag can point at any commit, including one whose suite is red. The build
  # job needs this gate, and the gate is the whole pytest workflow (tests on
  # 3.11/3.12, Windows, ruff, wheel packaging) rather than one Ubuntu job: a
  # release that needed only pytest published a wheel from a commit whose ruff,
  # Windows or packaging check was red, and never proved the wheel installs.
  verify:
    uses: ./.github/workflows/pytest.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      # Only the build toolchain is needed here: `python -m build --no-isolation`
      # imports the project metadata, not pymupdf or openpyxl, so installing the
      # runtime lock here only downloaded the largest dependency set for nothing.
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: rm -rf build dist
      - run: python -m build --wheel --no-isolation
      # The tag names the release, the build names the wheel: a v1.0.0 tag on a
      # commit that still declares 0.2.0 would publish a misleading asset.
      - name: Verify the wheel version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in
              *-"$tag"-*) ;;
              *) echo "ERROR: $(basename "$wheel") does not match tag v$tag"; exit 1 ;;
            esac
          done
      # publish nothing that has not been installed and imported: the wheel is
      # the artifact, and a dropped py-module or a broken console script only
      # shows up on a real install.
      - name: Install the wheel and smoke it before publishing
        run: |
          python -m venv "$RUNNER_TEMP/releaseenv"
          "$RUNNER_TEMP/releaseenv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/releaseenv/bin/fermi-organize" --help > /dev/null
          "$RUNNER_TEMP/releaseenv/bin/python" -c "import fermi_report_xlsx"
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.whl