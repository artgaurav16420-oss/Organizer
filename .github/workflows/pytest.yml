name: pytest
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      # Coverage ratchet: 80 is the measured baseline floor (actual ~83%);
      # raise it when coverage improves, never lower it to absorb a regression.
      - run: python -m pytest -q --cov=fermi_organizer --cov=fermi_report_xlsx --cov-fail-under=80
  test-windows:
    # MAX_PATH, _native(), os.replace and symlink-refusal tests skip off-Windows.
    # No coverage ratchet here by design: the ratchet is enforced once, on the
    # ubuntu job (same suite, plus the symlink tests that only run on Linux).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q
  packaging:
    # The wheel is the shipped artifact: build it and prove the console
    # script + top-level workbook module import from outside the repo root
    # (tests run through the conftest sys.path shim and never exercise this).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      # no-isolation: the build backend (setuptools) comes from the hashed
      # dev lock instead of an unpinned PyPI fetch inside an ephemeral venv.
      - run: python -m build --wheel --no-isolation
      - run: pip install --no-deps dist/*.whl
      - name: Smoke the installed wheel from a foreign cwd
        working-directory: ${{ runner.temp }}
        run: |
          fermi-organize --help > /dev/null
          python -c "import fermi_report_xlsx"
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check --select F,E9,B fermi_organizer tests fermi_report_xlsx.py organize_fermi_pdfs.py
