name: pytest
on:
  push:
    paths:
      - "**.py"
      - "**.md"
      - "requirements*.txt"
      - "requirements*.lock"
      - "pyproject.toml"
      - "setup.cfg"
      - "setup.py"
      - ".github/workflows/pytest.yml"
      - ".github/workflows/release.yml"
  # No `paths` filter here on purpose: these jobs are required status checks on
  # main, and a filtered-out PR leaves them "Expected" forever, so a docs-only
  # change could never merge. Markdown is in the push list because
  # tests/test_cve_watch.py pins the Tesseract floor stated in README.md and
  # THIRD_PARTY_NOTICES.md.
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      # Coverage ratchet: 83 is the measured baseline floor (actual ~84%);
      # raise it when coverage improves, never lower it to absorb a regression.
      - run: python -m pytest -q --cov=fermi_organizer --cov=fermi_report_xlsx --cov-fail-under=83
  test-windows:
    # MAX_PATH, _native(), os.replace and symlink-refusal tests skip off-Windows.
    # No coverage ratchet here by design: the ratchet is enforced once, on the
    # ubuntu job (same suite, plus the symlink tests that only run on Linux).
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q
  packaging:
    # The wheel is the shipped artifact: build it and prove the console
    # script + top-level workbook module import from outside the repo root
    # (tests run through the conftest sys.path shim and never exercise this).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.txt
      # clean build tree first: --no-isolation reuses a stale build/lib and can
      # ship deleted/ghost modules in the wheel.
      - run: rm -rf build dist
      - run: python -m build --wheel --no-isolation
      # Resolve the wheel's own Requires-Dist in a clean venv: installing with
      # --no-deps on top of the hashed lock proves nothing, so deleting pymupdf
      # from the metadata left this job green while a real `pip install` fails.
      - name: Install the wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/pip" install dist/*.whl
      - name: Smoke the installed wheel from a foreign cwd
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheelenv/bin/fermi-organize" --help > /dev/null
          "$RUNNER_TEMP/wheelenv/bin/python" -c "import fermi_report_xlsx"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: fermi-organizer-wheel
          path: dist/*.whl
          if-no-files-found: error
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check --select F,E9,B fermi_organizer tests fermi_report_xlsx.py organize_fermi_pdfs.py