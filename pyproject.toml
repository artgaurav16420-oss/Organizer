[build-system]
# setuptools>=80 is the measured floor: the SPDX-string `project.license`
# form is rejected by setuptools 77 and below (verified by building with
# 68/77/80; 80 builds, 77 fails with "must be valid exactly by one
# definition"). Do not lower this without re-probing.
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fermi-pdf-organizer"
version = "0.2.0"
description = "Organize Fermilab PDF drawings into a BOM-derived folder tree"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
# The wheel is the shipped artifact: PyMuPDF is dual AGPL/commercial, so the
# third-party notice has to travel with the AGPL code it explains.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "pymupdf==1.28.2",
]

[project.optional-dependencies]
excel = ["openpyxl==3.1.5"]

[project.scripts]
fermi-organize = "fermi_organizer.cli:main"

[tool.setuptools]
py-modules = ["fermi_report_xlsx"]

[tool.setuptools.packages.find]
include = ["fermi_organizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep `pytest -q` fast: coverage flags stay opt-in so a routine run does not
# pay the tracing cost. CI passes --cov explicitly.
addopts = ""

[tool.coverage.run]
source = ["fermi_organizer", "fermi_report_xlsx"]
# Branch coverage is the number that matters for this codebase: most defects
# found in review live in an unexercised branch (a failure recovery, a second
# revision, a skipped archive), not in an unexecuted line.
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
