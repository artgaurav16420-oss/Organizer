[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fermi-pdf-organizer"
version = "0.1.1"
description = "Organize Fermilab PDF drawings into a BOM-derived folder tree"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf==1.28.2",
]

[project.optional-dependencies]
excel = ["openpyxl==3.1.5"]

[project.scripts]
fermi-organize = "fermi_organizer.cli:main"

[tool.setuptools]
py-modules = ["fermi_report_xlsx"]

[tool.setuptools.packages.find]
include = ["fermi_organizer*"]
